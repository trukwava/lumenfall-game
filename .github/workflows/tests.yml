name: Test Lumenfall

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic combat tests
        run: node --test tests/core.test.cjs
